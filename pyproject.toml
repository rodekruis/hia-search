[project]
name = "hia-search"
version = "0.0.2"
description = "HIA search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Jacopo Margutti", email = "jmargutti@redcross.nl" },
]
dependencies = [
  "azure-identity",
  "azure-monitor-opentelemetry-exporter",
  "azure-search-documents",
  "clean-text",
  "fastapi",
  "langchain",
  "langchain-community",
  "langchain-openai",
  "langchain-text-splitters",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "orjson",
  "pandas",
  "python-dotenv",
  "python-multipart",
  "requests",
  "spacy",
  "twilio",
  "unidecode",
  "urllib3>=2.6.0",
  "uvicorn",
]

[project.urls]
Repository = "https://github.com/rodekruis/hia-search"

[dependency-groups]
dev = [
  "pytest",
  "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "routes", "utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
