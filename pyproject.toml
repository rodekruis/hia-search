[project]
name = "hia-search"
version = "0.0.2"
description = "HIA search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Jacopo Margutti", email = "jmargutti@redcross.nl" },
]
dependencies = [
  "azure-identity",
  "azure-search-documents",
  "clean-text",
  "fastapi",
  "langchain",
  "langchain-community",
  "langchain-openai>=1.7.2",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "orjson",
  "pandas",
  "psycopg[binary]",
  "psycopg-pool",
  "python-dotenv",
  "python-multipart",
  "requests",
  "twilio",
  "unidecode",
  "urllib3>=2.6.0",
  "uvicorn",
  "gunicorn>=26.2.0",
  "langfuse>=4,<6",
  "azure-monitor-opentelemetry>=1.8.10",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "opentelemetry-instrumentation-psycopg>=0.65b0",
  "pydantic-settings>=2.14.1",
]

[project.urls]
Repository = "https://github.com/rodekruis/hia-search"

[dependency-groups]
dev = [
  "pytest",
  "httpx",
  "ruff>=0.17.3",
  "ty>=0.0.95",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "routes", "utils", "subscriptions"]
artifacts = ["subscriptions/migrations/*.sql"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["integration: requires a disposable PostgreSQL server"]
